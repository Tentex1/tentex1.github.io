<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeler | Tentex</title>
    <link rel="icon" href="./pp.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="fade-out">
    <header>
        <nav>
            <div class="nav-left">
                <a href="index.html" class="logo">Tentex</a>
                <ul class="nav-links">
                    <li><a href="index.html" data-translate="nav-home">Ana Sayfa</a></li>
                    <li><a href="projeler.html" class="active" data-translate="nav-projects">Projeler</a></li>
                    <li><a href="hakkimda.html" data-translate="nav-about">Hakkımda</a></li>
                    <li><a href="iletisim.html" data-translate="nav-contact">İletişim</a></li>
                </ul>
            </div>
            <div class="nav-actions">
                <button id="lang-toggle" aria-label="Dili Değiştir" class="lang-btn">EN</button>
                <a href="https://github.com/Tentex1" target="_blank" class="github-link" aria-label="GitHub Profili"><i
                        class="fab fa-github"></i></a>
                <button id="theme-toggle" aria-label="Temayı Değiştir"><i class="fas fa-sun" id="icon-sun"></i><i
                        class="fas fa-moon" id="icon-moon"></i></button>
            </div>
            <div class="burger">
                <div class="line1"></div>
                <div class="line2"></div>
                <div class="line3"></div>
            </div>
            <div class="nav-loader"></div>
        </nav>
    </header>

    <main>
        <section id="projeler">
            <h2 data-translate="projects-title">Projelerim</h2>
            <div class="project-grid">
                <p class="loading-message" data-translate="projects-loading">GitHub'dan projeler yükleniyor...</p>
            </div>
        </section>
    </main>

    <div id="project-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeProjectModal()">&times;</span>
            <h2 id="modal-title">Proje Adı</h2>
            
            <div class="modal-meta">
                <span id="modal-lang" class="modal-badge"><i class="fas fa-code"></i> Dil</span>
                <span id="modal-stars" class="modal-badge"><i class="fas fa-star"></i> 0 Yıldız</span>
                <span id="modal-forks" class="modal-badge"><i class="fas fa-code-branch"></i> 0 Fork</span>
            </div>
            
            <p id="modal-description">Yükleniyor...</p>
            
            <div class="modal-actions">
                <a id="modal-github-link" href="#" target="_blank" class="btn"><i class="fab fa-github"></i> GitHub'da Gör</a>
                <a id="modal-live-link" href="#" target="_blank" class="btn btn-secondary" style="display: none;"><i class="fas fa-external-link-alt"></i> Canlı Site</a>
            </div>
        </div>
    </div>

    <footer>
        <p data-translate="footer-rights">&copy; 2026 Duran "Tentex". Tüm hakları saklıdır.</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
